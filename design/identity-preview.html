<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animating Buttons press symbol</title>
    <style>
      @font-face { font-family: OpenRunde; src: url('../public/fonts/OpenRunde-Regular.woff2'); }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 48px 24px; background: #000; color: #fff; font: 16px/1.5 OpenRunde, system-ui, sans-serif; }
      main { max-width: 1200px; margin: auto; }
      h1 { margin: 0 0 12px; font-size: 36px; line-height: 40px; letter-spacing: -1px; }
      p { max-width: 640px; margin: 0 0 32px; color: #aaa; }
      img { width: 100%; height: auto; border-radius: 24px; }
    </style>
  </head>
  <body>
    <main>
      <h1>A mark made to click.</h1>
      <p>The royal-blue press symbol pairs a rounded button cap with an offset base. Two shapes, a little movement, and a clear silhouette at every size.</p>
      <img src="../public/brand/identity-preview.svg" width="1200" height="680" alt="Animating Buttons logo at favicon sizes, with light and dark wordmarks" />
    </main>
  </body>
</html>

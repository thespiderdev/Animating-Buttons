<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migration viewport check</title><style>body{margin:0;background:#ddd;color:#222;font:13px system-ui}nav{min-height:44px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 12px}button{padding:5px 10px}#holder{position:relative;margin:auto}iframe{position:absolute;left:0;top:0;transform-origin:top left;border:0;background:#000;border-radius:16px}#metrics{max-width:480px;margin:8px auto;font:11px system-ui;padding:0 12px}</style></head><body><nav><strong id="size"></strong><button id="dark">Dark</button><button id="light">Light</button></nav><div id="holder"></div><pre id="metrics"></pre><script>const params=new URLSearchParams(location.search),path=params.get('path')||'/',width=Number(params.get('width'))||390,height=844,scale=Math.min(1,(innerWidth-32)/width,(innerHeight-100)/height),holder=document.getElementById('holder');holder.style.width=width*scale+'px';holder.style.height=height*scale+'px';document.getElementById('size').textContent=width+' × '+height;const frame=document.createElement('iframe');frame.title=width+'px preview';frame.width=width;frame.height=height;frame.style.transform='scale('+scale+')';frame.src=path.startsWith('/')?path:'/';holder.append(frame);frame.onload=()=>{const doc=frame.contentDocument;document.getElementById('metrics').textContent=JSON.stringify({viewport:frame.contentWindow.innerWidth,document:doc.documentElement.scrollWidth,heading:doc.querySelector('h1')?.textContent})};for(const theme of ['dark','light'])document.getElementById(theme).onclick=()=>{localStorage.setItem('theme',theme);frame.src=frame.src};</script></body></html>
